services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-http://127.0.0.1:54321}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-replace-with-local-anon-key}
    healthcheck:
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    ports:
      - "${RELEASEARC_PORT:-${PROJECTPULSE_PORT:-8080}}:8080"
